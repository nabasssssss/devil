<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Map & Landmark Explorer</title>
  <link rel="stylesheet" href="./style.css">
  <!-- FontAwesome icons for header/map UI elements -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<section class="msger">
  <header class="msger-header">
    <div class="msger-header-title">
      <i class="fas fa-map-marked-alt"></i> Landmark & Map Explorer
    </div>
    <div class="msger-header-options">
      <span><i class="fas fa-layer-group"></i></span>
    </div>
  </header>

  <main class="msger-chat">
    <div class="msg left-msg">
      <div
       class="msg-img"
       style="background-image: url(https://image.flaticon.com/icons/svg/854/854878.svg)"
      ></div>

      <div class="msg-bubble">
        <div class="msg-info">
          <div class="msg-info-name">Map Guide</div>
          <div class="msg-info-time">Just now</div>
        </div>

        <div class="msg-text">
          Welcome to Landmark Explorer! 🗺️ Ask me about world landmarks, cities, or places to explore photos, details, and coordinates on the map.
        </div>
      </div>
    </div>
  </main>

  <form class="msger-inputarea">
    <input type="text" class="msger-input" placeholder="Search a place or landmark (e.g., Edinburgh Castle, Eiffel Tower)...">
    <button type="submit" class="msger-send-btn">Search</button>
  </form>
</section>

<script src="./script.js"></script>
</body>
</html>

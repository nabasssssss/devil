<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map & Route Finder</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body onload="gpsLocation()">
<section class="msger">
  <header class="msger-header">
    <div class="msger-header-title">
      <i class="fas fa-map-marked-alt"></i> Interactive Map Explorer
    </div>
    <div class="msger-header-options">
      <span><i class="fas fa-layer-group"></i></span>
    </div>
  </header>

  <main class="msger-chat">
    <div class="msg left-msg">
      <div
       class="msg-img"
       style="background-image: url(https://image.flaticon.com/icons/svg/854/854878.svg)"
      ></div>

      <div class="msg-bubble">
        <div class="msg-info">
          <div class="msg-info-name">Map System</div>
          <div class="msg-info-time"></div>
        </div>

        <div class="msg-text">
          Welcome to Map Explorer! Turn on your location services to view your current coordinates, locate nearby places, and calculate routes. 🗺️📍
        </div>
      </div>
    </div>

  </main>

  <form class="msger-inputarea">
    <input type="text" class="msger-input" placeholder="Enter an address, city, or coordinates...">
    <button type="submit" class="msger-send-btn">Find on Map</button>
  </form>
</section>
<script src="./script.js"></script>
<p id="techchip"></p>
<!-- tc_payload -->

</body>
</html>
